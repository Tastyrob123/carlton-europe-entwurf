<style>
.mappe{min-height:100svh;background:var(--nacht) url('assets/img/tapete-navy.webp') center/520px;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.mappe__kopf{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);padding:10px 0 18px}
.mappe__kopf svg{width:44px;height:auto}
.mappe__kopf b{font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:.02em;color:var(--creme)}
.mappe__kopf span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mappe__fuss{text-align:center;font-size:12px;color:var(--creme);opacity:.7;padding:16px 0 0}
.mappe__fuss a{text-decoration:underline}
/* Die Mappe füllt genau den Bildschirm: Kopf, Gespräch (rollt), Eingabe unten */
html,body.mappe{height:100%}
body.mappe{display:flex;flex-direction:column;height:100svh;overflow:hidden}
.mappe main{flex:1;min-height:0;display:flex;flex-direction:column}
.mappe .gast--seite{flex:1;min-height:0!important;height:auto;width:100%;display:flex;flex-direction:column}
.mappe .gast--seite .gast__lauf{min-height:0!important;flex:1}
.mappe__kopf,.mappe__fuss{flex:none}
/* Schönere Mappe (18.10.2026 20:33): Hausbild, Karte nur so hoch wie das Gespräch, Vorschläge als Kacheln mit Zeichen */
.mappe__bild{position:relative;flex:1 1 200px;min-height:0;margin:0 0 14px;border-radius:20px;overflow:hidden;background:#0b1f40;box-shadow:0 0 0 1px rgba(220,198,143,.35),0 30px 50px -30px rgba(0,0,0,.9)}
.mappe__bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.mappe__bild figcaption{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;padding:12px 16px;border-radius:12px;background:rgba(6,20,43,.86);box-shadow:inset 0 0 0 1px rgba(220,198,143,.35)}
.mappe__bild figcaption b{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2;color:#fbf6ea}
.mappe__bild figcaption em{color:var(--gold)}
.mappe__bild figcaption span{font-size:12px;letter-spacing:.06em;color:rgba(251,246,234,.72)}
.mappe main{flex:0 1 auto}
.mappe .gast--seite{flex:0 1 auto;max-height:100%}
.mappe .gast--seite .gast__lauf{flex:0 1 auto}
.mappe .gast__vor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2px}
body.mappe .gast__vor button{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;min-height:96px;padding:14px 14px 13px;border-radius:14px;text-align:left;
  background:linear-gradient(180deg,#fffdf7,#f7f0e1);box-shadow:inset 0 0 0 1px rgba(184,152,80,.32),0 1px 0 #fff,0 14px 22px -18px rgba(11,31,64,.55);transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s}
body.mappe .gast__vor button:hover{background:linear-gradient(180deg,#fffdf7,#f7f0e1);transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(184,152,80,.5),0 1px 0 #fff,0 18px 26px -18px rgba(11,31,64,.6)}
body.mappe .gast__vor .gast__vi{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#183463,#0b1f40);box-shadow:inset 0 0 0 1px rgba(220,198,143,.45)}
body.mappe .gast__vor .gast__vi svg{width:19px;height:19px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.mappe .gast__vor small{margin-top:11px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8a7545}
body.mappe .gast__vor b{margin-top:3px;font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.3;color:#0b1f40}
body.mappe .gast__vor button>svg{display:none}
@media (max-width:899px){
  .mappe__bild{flex:1 1 120px;min-height:96px}
  .mappe__bild figcaption{left:10px;right:auto;bottom:10px;padding:8px 13px}
  .mappe__bild figcaption b{font-size:16px}
  .mappe__bild figcaption span{font-size:11px}
  .mappe__bild{flex-basis:96px;min-height:84px}
  .mappe .gast__vor{gap:8px}
  body.mappe .gast__vor button{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px;align-items:center;align-content:start;min-height:0;padding:10px 11px 11px}
  body.mappe .gast__vor .gast__vi{width:24px;height:24px}
  body.mappe .gast__vor .gast__vi svg{width:13px;height:13px}
  body.mappe .gast__vor small{margin:0;font-size:9px;letter-spacing:.14em}
  body.mappe .gast__vor b{grid-column:1 / 3;margin-top:7px;font-size:14px;line-height:1.25;overflow-wrap:normal;word-break:normal;hyphens:manual}
}
@media (min-width:900px){
  body.mappe{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,500px);grid-template-rows:auto minmax(0,1fr) auto;column-gap:32px;padding:28px 32px}
  .mappe__bild{grid-column:1;grid-row:1 / 4;margin:0;border-radius:24px}
  .mappe__bild figcaption{left:24px;right:auto;bottom:24px;padding:18px 24px}
  .mappe__bild figcaption b{font-size:26px}
  .mappe__kopf{grid-column:2;grid-row:1;justify-content:flex-start;padding:4px 0 18px}
  .mappe main{grid-column:2;grid-row:2;align-self:center;max-height:100%}
  .mappe__fuss{grid-column:2;grid-row:3;text-align:left}
}
/* Kacheln mit echtem Foto oben (Robert 18.10.2026 23:48): Foto, darunter Zeichen, Bereich und Frage; am Laptop drei Spalten in breiterer Mappe */
body.mappe .gast__vor button{padding:0;overflow:hidden;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:8px;align-items:center;align-content:start}
body.mappe .gast__vf{grid-column:1 / 3;display:block;aspect-ratio:16/10;overflow:hidden;background:#e8dbbf}
body.mappe .gast__vf img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.22,1,.36,1)}
body.mappe .gast__vor button:hover .gast__vf img{transform:scale(1.04)}
body.mappe .gast__vor .gast__vi{width:24px;height:24px;margin:10px 0 0 12px}
body.mappe .gast__vor .gast__vi svg{width:13px;height:13px}
body.mappe .gast__vor small{margin:10px 12px 0 0}
body.mappe .gast__vor b{grid-column:1 / 3;margin:6px 12px 12px;font-size:14.5px;line-height:1.25;overflow-wrap:normal;word-break:normal;hyphens:manual}
@media (min-width:900px){
  body.mappe{grid-template-columns:minmax(0,1fr) minmax(460px,640px)}
  .mappe .gast__vor{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:899px){
  .mappe__bild{display:none}
  body.mappe .gast__vf{aspect-ratio:5/2}
  body.mappe .gast__vor .gast__vi,body.mappe .gast__vor small{display:none}
  body.mappe .gast__vor b{font-size:13.5px;margin:8px 10px 10px}
}
/* Im Handy der Vorführseite: Platz für die Kamera-Insel */
.im-rahmen body.mappe{padding-top:50px}
